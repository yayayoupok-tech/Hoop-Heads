'use strict';
/*
  HOOP HEADS — an offline arcade basketball game.
  One self-contained file: vanilla JavaScript, Canvas 2D, Web Audio. No frameworks, no build step,
  no network requests except the optional Google Font. Everything you see is drawn in code and
  everything you hear is synthesized.

  Sections (in this order):
    CONFIG → UTIL → INPUT → AUDIO → PHYSICS → ENTITIES → MECHANICS → AI → RULES → EVENTS → CAMERA

// Softmax pick over an array of scores with a temperature, using the seeded RNG. Returns the index.
const _smx = new Float64Array(16);

  const vn = b.vx * nx + b.vy * ny;
  if (vn < 0) { const j = -(1 + rest) * vn; b.vx += j * nx; b.vy += j * ny; b.vx *= 0.96; b.vy *= 0.96; contact.impact = Math.max(contact.impact, -vn); }
  b.spin += (b.vx * ny - b.vy * nx) * 2;
  return true;
}

// One physics substep for the ball. heads: array of {x, y, r, id} big-head colliders (may be null).
function ballSubstep(b, dt, contact, heads, nHeads) {
  const g = -G, r = BALL.radius;
  const py = b.y;
  b.x += b.vx * dt; b.y += b.vy * dt + 0.5 * g * dt * dt; b.vy += g * dt;
  // floor
  if (b.y < r) {
    b.y = r;
    if (b.vy < 0) { contact.impact = Math.max(contact.impact, -b.vy); if (-b.vy > BALL.restSpeed) { b.vy = -b.vy * BALL.restFloor; contact.floor = true; } else b.vy = 0; b.vx *= BALL.floorFriction; }
    if (b.vy === 0) { const f = BALL.rollFriction * dt; if (Math.abs(b.vx) <= f) b.vx = 0; else b.vx -= sgn(b.vx) * f; }
    b.fromBelow = false; b.armed = false;
  }
  // walls
  if (b.x < WALL_L + r) { b.x = WALL_L + r; if (b.vx < 0) { contact.impact = Math.max(contact.impact, -b.vx); b.vx = -b.vx * BALL.restWall; contact.wall = true; } }
  else if (b.x > WALL_R - r) { b.x = WALL_R - r; if (b.vx > 0) { contact.impact = Math.max(contact.impact, b.vx); b.vx = -b.vx * BALL.restWall; contact.wall = true; } }
  // hoops
  for (let h = 0; h < 2; h++) {
    const H = HOOPS[h];
    if (Math.abs(b.x - H.x) > 1.6 || b.y < 1.9 || b.y > 5.5) continue;
    // backboard: vertical segment at H.boardX between boardBottom and boardTop, ball approaches from the rim side
    if (b.y + r > H.boardBottom && b.y - r < H.boardTop) {
      const dxb = (b.x - H.boardX) * H.dir; // negative = on the rim side of the board
      if (dxb > -r && dxb < 0.25) {
        if (b.y > H.boardBottom - 0.02 && b.y < H.boardTop + 0.02) {
          b.x = H.boardX - H.dir * r;
          const vn = b.vx * H.dir; if (vn > 0) { contact.impact = Math.max(contact.impact, vn); b.vx = -b.vx * BALL.restBoard; b.vy *= 0.97; contact.board = true; }
        } else if (b.y <= H.boardBottom) { // bottom corner as a point
          if (collideCircle(b, H.boardX, H.boardBottom, 0.01, BALL.restBoard, contact, 'board')) contact.board = true;
        }
      }
    }
    // rim edge colliders
    const cr = W.rimColliderRadius;
    if (collideCircle(b, H.frontX, H.y, cr, BALL.restRim, contact, 'rim')) { contact.rim = true; contact.rimFront = true; }
    if (collideCircle(b, H.backX, H.y, cr, BALL.restRim, contact, 'rim')) { contact.rim = true; contact.rimBack = true; }
    // arming and scoring
    const dx = Math.abs(b.x - H.x);
    if (b.y > H.y + BALL.armHeight && dx < 1.2 && !b.fromBelow) b.armed = true;
    if (b.fromBelow && (dx > 0.5 || b.y < H.y - 0.6)) b.fromBelow = false;
    if (py >= H.y && b.y < H.y && b.vy < 0 && dx < RIM_R) {
      if (b.armed) { contact.scored = h; contact.throughRim = h; b.armed = false; }
    }
    if (py < H.y && b.y >= H.y && dx < RIM_R + 0.05 && b.vy > 0) { b.fromBelow = true; b.armed = false; }
    // net drag (visual net can never stop a basket)
    if (dx < RIM_R + 0.05 && b.y < H.y && b.y > H.y - W.netDepth) { const k = Math.max(0, 1 - BALL.netDrag * dt); b.vx *= k; b.vy *= k; contact.netIn = true; }
  }
  // big heads (only for balls nobody owns)
  if (heads) for (let i = 0; i < nHeads; i++) { const hd = heads[i]; if (hd.skip) continue; const dx = b.x - hd.x, dy = b.y - hd.y, rr = r + hd.r; if (dx * dx + dy * dy < rr * rr) { const vxr = b.vx - hd.vx, vyr = b.vy - hd.vy; const sp = Math.sqrt(vxr * vxr + vyr * vyr); if (collideCircle(b, hd.x, hd.y, hd.r, BALL.restHead, contact, 'head')) { b.vx += hd.vx * 0.5; b.vy += Math.max(0, hd.vy) * 0.5; if (sp > BALL.bonkMinSpeed) contact.head = hd.id; } } }
  b.spin += b.vx * BALL.spinVisual * dt * 0.3;
}

// A full sim step of ball physics (substepped).
function ballStep(b, dt, contact, heads, nHeads) {
  const n = CONFIG.sim.ballSubsteps, sdt = dt / n;
  for (let i = 0; i < n; i++) ballSubstep(b, sdt, contact, heads, nHeads);
}

// Ball-only look-ahead used by the shot solver and by bots predicting rebounds. Returns a reused result struct.
const _laBall = makeBallState(), _laContact = makeContact();
const _laResult = { scored: false, hoop: -1, rim: false, board: false, rimFirst: false, boardFirst: false, floor: false, t: 0, landX: 0, landT: 0, apexY: 0, catchX: 0, catchY: 0, catchT: 0, firstContact: '', rimFront: false, rimBack: false };
function lookAhead(b, maxT, catchHeight, stopAtCatch) {
  const s = copyBallState(_laBall, b), c = _laContact, R = _laResult;
  R.scored = false; R.hoop = -1; R.rim = false; R.board = false; R.rimFirst = false; R.boardFirst = false; R.floor = false; R.t = 0; R.landX = s.x; R.landT = -1; R.apexY = s.y; R.catchX = -1; R.catchY = 0; R.catchT = -1; R.firstContact = ''; R.rimFront = false; R.rimBack = false;
  const sdt = STEP / CONFIG.sim.ballSubsteps; const n = Math.ceil(maxT / sdt); const ch = catchHeight || 0;
  let touched = false;
  for (let i = 0; i < n; i++) {
    clearContact(c); ballSubstep(s, sdt, c, null, 0); R.t += sdt;
    if (s.y > R.apexY) R.apexY = s.y;
    if (c.scored >= 0) { R.scored = true; R.hoop = c.scored; }
    if (c.rim) { R.rim = true; if (!touched) { R.rimFirst = true; R.firstContact = c.rimFront ? 'rimFront' : 'rimBack'; } touched = true; if (c.rimFront) R.rimFront = true; if (c.rimBack) R.rimBack = true; }
    if (c.board) { R.board = true; if (!touched) { R.boardFirst = true; R.firstContact = 'board'; } touched = true; }
    if (c.floor) { R.floor = true; if (R.landT < 0) { R.landT = R.t; R.landX = s.x; } if (!touched) { R.firstContact = 'floor'; touched = true; } }
    if (ch > 0 && R.catchT < 0 && s.vy < 0 && s.y < ch && (touched || s.y < RIM_Y - 0.2)) { R.catchT = R.t; R.catchX = s.x; R.catchY = s.y; if (stopAtCatch) break; }
    if (R.scored && s.y < RIM_Y - 0.5) break;
    if (R.landT >= 0 && s.vy === 0 && Math.abs(s.vx) < 0.5) break;
    if (R.floor && s.y < 0.6 && !R.scored && R.landT >= 0 && R.t > R.landT + 0.4) break;
  }
  if (R.landT < 0) { R.landT = R.t; R.landX = s.x; }
  return R;
}

// Analytic launch: from (x0,y0) to (xT,yT) with an apex H above y0. Returns [vx, vy, t] in the out array.
function solveLaunch(x0, y0, xT, yT, H, out) {
  H = Math.max(H, yT - y0 + 0.05);
  const vy = Math.sqrt(2 * G * H);
  const t = vy / G + Math.sqrt(Math.max(0, 2 * (y0 + H - yT) / G));
  out[0] = (xT - x0) / t; out[1] = vy; out[2] = t; return out;
}

// ============================================================================
// SECTION: FX — pooled particles, hit-stop, slow-mo, screen shake, callouts, posters; all driven by events
// ============================================================================
class FXSystem {
  constructor() {
    this.pool = new Pool(() => ({ x: 0, y: 0, z: 0.5, vx: 0, vy: 0, life: 0, max: 1, size: 0.1, color: '#fff', kind: 0, g: 0, rot: 0 }), CONFIG.fx.particleBudget);

  }

  slowMo(s) { if (!this.reduceMotion) this.slowMoT = Math.max(this.slowMoT, s); }
  spawn(kind, x, y, z, n, color, opts) {
    opts = opts || {}; const rngf = Math.random; if (this.pool.count + n > this.budget) n = Math.max(0, this.budget - this.pool.count);
    for (let i = 0; i < n; i++) { const p = this.pool.alloc(); if (!p) return; p.kind = kind; p.x = x + (rngf() - 0.5) * (opts.spread || 0.2); p.y = y + (rngf() - 0.5) * (opts.spreadY || 0.1); p.z = z; p.color = Array.isArray(color) ? color[i % color.length] : color; p.rot = rngf() * TAU;
      if (kind === 'dust') { p.vx = (rngf() - 0.5) * 2.5; p.vy = rngf() * 1.2 + 0.3; p.life = p.max = 0.35 + rngf() * 0.25; p.size = 0.06 + rngf() * 0.08; p.g = 1; }
      else if (kind === 'spark') { const a = rngf() * TAU; const sp = 2 + rngf() * 4; p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp; p.life = p.max = 0.25 + rngf() * 0.2; p.size = 0.03 + rngf() * 0.03; p.g = 12; }
      else if (kind === 'sweat') { p.vx = (rngf() - 0.5) * 1.5 - (opts.dir || 0) * 1.5; p.vy = 1.5 + rngf(); p.life = p.max = 0.4; p.size = 0.04; p.g = 14; }
      else if (kind === 'ring') { p.vx = 0; p.vy = 0; p.life = p.max = 0.45; p.size = 0.2; p.g = 0; }
      else if (kind === 'flame') { p.vx = (rngf() - 0.5) * 1.2; p.vy = 1.5 + rngf() * 2; p.life = p.max = 0.3 + rngf() * 0.25; p.size = 0.08 + rngf() * 0.1; p.g = -2; }
      else if (kind === 'confetti') { p.vx = (rngf() - 0.5) * 6; p.vy = 4 + rngf() * 6; p.life = p.max = 2 + rngf() * 1.5; p.size = 0.08 + rngf() * 0.06; p.g = 6; }
      else if (kind === 'star') { const a = rngf() * TAU; p.vx = Math.cos(a) * 2; p.vy = Math.sin(a) * 2 + 1; p.life = p.max = 0.6; p.size = 0.1; p.g = 3; }
    }
  }
  update(dt, m) {
    this.time += dt; const P = this.pool;
    for (let i = P.count - 1; i >= 0; i--) { const p = P.items[i]; p.life -= dt; if (p.life <= 0) { P.free(i); continue; } p.vy -= p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.kind === 'confetti') { p.vx *= 0.98; p.rot += dt * 6; if (p.y < 0.05) { p.y = 0.05; p.vy = 0; p.vx = 0; } } if (p.kind === 'ring') p.size += dt * 3.5; if (p.kind === 'dust' && p.y < 0.03) { p.y = 0.03; p.vy = 0; } }

  }
  draw(ctx, cam) {
    const P = this.pool;
    for (let i = 0; i < P.count; i++) { const p = P.items[i]; const s = cam.scale(p.z); const sx = cam.sx(p.x), sy = cam.sy(p.y, p.z); const a = clamp01(p.life / p.max); ctx.globalAlpha = p.kind === 'ring' ? a * 0.8 : Math.min(1, a * 1.5);
      if (p.kind === 'ring') { ctx.strokeStyle = p.color; ctx.lineWidth = Math.max(2, s * 0.05 * a); ctx.beginPath(); ctx.ellipse(sx, sy, p.size * s, p.size * s * 0.45, 0, 0, TAU); ctx.stroke(); }
      else if (p.kind === 'confetti') { ctx.fillStyle = p.color; ctx.save(); ctx.translate(sx, sy); ctx.rotate(p.rot); ctx.fillRect(-p.size * s / 2, -p.size * s / 4, p.size * s, p.size * s / 2); ctx.restore(); }
      else if (p.kind === 'star') { ctx.fillStyle = p.color; ctx.font = fontStr(p.size * s * 2.2, true); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('★', sx, sy); }
      else { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(sx, sy, Math.max(1, p.size * s * (p.kind === 'dust' ? (1.6 - a * 0.6) : a)), 0, TAU); ctx.fill(); }
    }

  }
}

    for (const h of HOOPS) this.world.drawHoopBack(ctx, cam, h, court);
    const players = rp ? m.replay.ghosts : m.players; const ball = rp ? m.replay.ghostBall : m.ball;
    const order = players.filter(p => !p.hidden).slice().sort((a, b) => a.z - b.z); let ballDrawn = false;
    for (const p of order) { if (!ballDrawn && ball.z < p.z - 0.01 && !ball.owner) { this.world.drawBall(ctx, cam, ball, alpha, m.ball.skin, false); ballDrawn = true; } drawPlayer(ctx, cam, p, alpha, ball, m.teams[p.team], { replay: !!rp }); if (ball.owner === p) { this.world.drawBall(ctx, cam, ball, alpha, m.ball.skin, p.onFire > 0); ballDrawn = true; } }
    if (!ballDrawn) this.world.drawBall(ctx, cam, ball, alpha, m.ball.skin, !!(m.ball.shot && m.ball.shot.shooter.onFire > 0));
    HOOPS.forEach((h, i) => this.world.drawHoopFront(ctx, cam, h, court, i));
    if (m.contest3) this.drawRacks(ctx, cam, m);
    this.fx.draw(ctx, cam);
    // paper grain over the frame (dropped by the perf guard)
    if (!this.perf.degraded && PRINT.grainPattern) { ctx.globalAlpha = 0.16; ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = PRINT.grainPattern; ctx.fillRect(0, 0, this.W, this.H); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; }
  }
  drawRacks(ctx, cam, m) { const c = m.contest3; c.racks.forEach((r, i) => { const s = cam.scale(r.z); const x = cam.sx(r.x), y = cam.sy(0, r.z); const used = i < c.rack ? CONFIG.contest3.ballsPerRack : (i === c.rack ? c.ball : 0); inkShape(ctx, cc => cc.rect(x - s * 0.3, y - s * 0.55, s * 0.6, s * 0.55), i === c.rack ? '#FFD23F' : '#F3F0FF', INK, 2); for (let k = 0; k < CONFIG.contest3.ballsPerRack; k++) { const bx = x - s * 0.24 + k * s * 0.12, by = y - s * 0.62; ctx.fillStyle = k < used ? 'rgba(20,12,40,0.2)' : (k === 4 ? '#FF4FA3' : '#FF8A2A'); ctx.beginPath(); ctx.arc(bx, by, s * 0.05, 0, TAU); ctx.fill(); } }); }
  drawHUD(ctx, m, alpha, dt) {
    const W_ = this.W, H_ = this.H, cam = this.cam, S = this.save.data.settings, rp = this.replayPlayer;
    ctx.save(); ctx.translate(0, this.safe.top);
    if (rp) { stampText(ctx, 'REPLAY', W_ / 2, 60, 44, '#F3F0FF', INK, -3); ctx.fillStyle = 'rgba(243,240,255,0.8)'; ctx.fillRect(W_ * 0.3, 90, W_ * 0.4 * rp.progress, 4); ctx.font = fontStr(14, false); ctx.textAlign = 'center'; ctx.fillStyle = '#F3F0FF'; ctx.fillText(rp.clip.label + (rp.clip.player ? ' · ' + rp.clip.player : '') + '   (jump to skip)', W_ / 2, 112); ctx.restore(); return; }
    if (!m.practice && !m.contest3) drawScoreBug(ctx, m, W_); 
    if (m.contest3) { const c = m.contest3; stampText(ctx, fmtClockTenths(c.timeLeft), W_ / 2, 40, 44, '#F3F0FF', INK, 0); ctx.fillStyle = '#F3F0FF'; ctx.font = fontStr(22, true); ctx.textAlign = 'center'; ctx.fillText('SCORE ' + c.score + '   ·   rack ' + Math.min(c.rack + 1, 5) + '/5   ball ' + Math.min(c.ball + 1, 5) + '/5', W_ / 2, 80); if (!c.started) { ctx.font = fontStr(18, false); ctx.fillText('Walk to the glowing rack and shoot. The clock starts on your first shot.', W_ / 2, 110); } }
    if (m.practice && m.practice.breakdown) { const pr = m.practice; ctx.fillStyle = 'rgba(20,12,40,0.6)'; ctx.fillRect(10, 10, 230, 120); ctx.fillStyle = '#F3F0FF'; ctx.font = fontStr(14, false); ctx.textAlign = 'left'; ctx.textBaseline = 'top'; const z = pr.byZone; const line = (k, l) => l + ' ' + z[k][0] + '/' + z[k][1] + (z[k][1] ? ' (' + Math.round(100 * z[k][0] / z[k][1]) + '%)' : ''); [ 'PRACTICE · ' + pr.makes + '/' + pr.shots + ' made', line('lay', 'Layups'), line('mid', 'Mid'), line('three', 'Threes'), line('deep', 'Deep'), line('dunk', 'Dunks') ].forEach((l, i) => ctx.fillText(l, 18, 16 + i * 18)); }
    if (m.practice && m.practice.chart) { const pr = m.practice; const hoop = m.human.hoop; const x0 = W_ - 250, y0 = 10, w = 240, h = 70; ctx.fillStyle = 'rgba(20,12,40,0.6)'; ctx.fillRect(x0, y0, w, h); ctx.fillStyle = '#F3F0FF'; ctx.font = fontStr(12, false); ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText('SHOT CHART (distance)', x0 + 6, y0 + 4); for (const s of pr.chart.slice(-60)) { const px = x0 + 10 + clamp01(s.d / 13) * (w - 20), py = y0 + 40 + ((s.id * 7) % 20); ctx.fillStyle = s.make ? '#B8FF5A' : '#FF4FA3'; ctx.beginPath(); ctx.arc(px, py, 3, 0, TAU); ctx.fill(); } ctx.fillStyle = '#F3F0FF'; ctx.fillText('0 m', x0 + 6, y0 + 56); ctx.textAlign = 'right'; ctx.fillText('13 m', x0 + w - 6, y0 + 56); }
    // shot meter for the controlled player (and any shooter when the meter is on)
    for (const p of m.players) if (p.controlled || (p.inState('jumpshot', 'floater') && S.meter === 'on' && false)) drawShotMeter(ctx, cam, p, alpha, S.meter, m.lastShot, m.time);
    drawCallouts(ctx, m, W_, H_, dt);
    // off-screen arrow for high lobs / balls
    const b = m.ball; const bsx = cam.sx(b.x), bsy = cam.sy(b.y, b.z); if ((bsy < -10 || bsx < -10 || bsx > W_ + 10) && !b.owner) { const ax = clamp(bsx, 30, W_ - 30), ay = clamp(bsy, CONFIG.camera.lobArrowMargin + 70, H_ - 30); inkShape(ctx, c => c.arc(ax, ay, 14, 0, TAU), '#FF8A2A', INK, 2); ctx.fillStyle = INK; ctx.beginPath(); ctx.moveTo(ax, ay - 22); ctx.lineTo(ax - 8, ay - 12); ctx.lineTo(ax + 8, ay - 12); ctx.fill(); }
    // inbound hold indicator, phase banners
    if (m.phase === 'freethrow' && m.ftState) { ctx.fillStyle = '#F3F0FF'; ctx.font = fontStr(18, true); ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText('FREE THROW ' + (m.ftState.index + 1) + ' of ' + m.ftState.count + ' · ' + m.ftState.shooter.nick, W_ / 2, 80); }
    if (m.phase === 'pregame') stampText(ctx, m.teams[0].name.toUpperCase() + '  vs  ' + m.teams[1].name.toUpperCase(), W_ / 2, H_ * 0.5, 34, '#F3F0FF', INK, -2);
    if (this.tutorial) { const st = TUTORIAL_STEPS[this.tutorial.step]; const L = this.input.hintLabels(); const text = st.text.replace('{move}', L.move).replace('{jump}', L.jump).replace('{shoot}', L.shoot).replace('{action}', L.action).replace('{down}', L.down); inkShape(ctx, c => roundRectPath(c, W_ / 2 - 360, 20, 720, 64, 8), '#FFF7D6', INK, 2.5); ctx.fillStyle = INK; ctx.font = fontStr(14, true); ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText('TUTORIAL ' + (this.tutorial.step + 1) + '/' + TUTORIAL_STEPS.length + '  (Esc to pause and quit)', W_ / 2 - 344, 28); ctx.font = fontStr(18, false); ctx.fillText(text, W_ / 2 - 344, 50); }
    else { const offense = m.ball.owner ? m.ball.owner.team === m.humanTeam : m.possession === m.humanTeam; drawHints(ctx, m, this.input, W_, H_, offense); }
    if (this.overlays.f1) drawDebugF1(ctx, cam, m); if (this.overlays.f2) drawDebugF2(ctx, cam, m); if (this.overlays.f3) drawDebugF3(ctx, m, W_);
    if (m.dev && m.invariantCount > 0) { ctx.fillStyle = '#FF4FA3'; ctx.font = fontStr(12, true); ctx.textAlign = 'left'; ctx.fillText('invariant failures: ' + m.invariantCount, 10, H_ - 20); }
    ctx.restore();
    if (this.input.touch.visible) { const offense = m.ball.owner ? m.ball.owner.team === m.humanTeam : m.possession === m.humanTeam; this.input.touch.offense = offense; drawTouchControls(ctx, this.input.touch, offense); }
    if (m.ended && !this.ui.screen && this.after.kind === 'practice') { ctx.fillStyle = '#F3F0FF'; ctx.font = fontStr(18, true); ctx.textAlign = 'center'; ctx.fillText('Practice over · Esc for the summary', W_ / 2, H_ - 40); }
  }
  drawPosterCard(ctx, ps) { const W_ = this.W, H_ = this.H; const k = easeOutBack(clamp01((CONFIG.fx.posterMs / 1000 - ps.t) / 0.25)); ctx.fillStyle = 'rgba(30,22,51,0.5)'; ctx.fillRect(0, 0, W_, H_); const cw = Math.min(W_ * 0.7, H_ * 0.7 * ps.canvas.width / ps.canvas.height), ch = cw * ps.canvas.height / ps.canvas.width; ctx.save(); ctx.translate(W_ / 2, H_ / 2); ctx.rotate(-0.035); ctx.scale(k, k); ctx.fillStyle = '#F3F0FF'; ctx.fillRect(-cw / 2 - 14, -ch / 2 - 14, cw + 28, ch + 28); ctx.drawImage(ps.canvas, -cw / 2, -ch / 2, cw, ch); ctx.restore(); }
  drawFocusHint(ctx, W_, H_) { const t = performance.now() / 1000; const w = Math.min(520, W_ - 40); inkShape(ctx, c => roundRectPath(c, W_ / 2 - w / 2, H_ - 96, w, 52, 8), '#FFD23F', INK, 3); ctx.fillStyle = INK; ctx.font = fontStr(Math.min(22, w / 22), true); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText((Math.sin(t * 5) > 0 ? '▶ ' : '   ') + 'CLICK THE GAME TO GIVE IT THE KEYBOARD', W_ / 2, H_ - 70); }
  drawRotate(ctx, W_, H_) { ctx.fillStyle = '#1E1633'; ctx.fillRect(0, 0, W_, H_); stampText(ctx, 'ROTATE', W_ / 2, H_ * 0.4, Math.min(80, W_ * 0.2), '#FF4FA3', '#F3F0FF', -4); stampText(ctx, 'YOUR PHONE', W_ / 2, H_ * 0.4 + Math.min(80, W_ * 0.2), Math.min(60, W_ * 0.15), '#FF8A2A', '#F3F0FF', 3); ctx.fillStyle = '#F3F0FF'; ctx.font = fontStr(18, false); ctx.textAlign = 'center'; ctx.fillText('Hoop Heads plays in landscape.', W_ / 2, H_ * 0.62); ctx.save(); ctx.translate(W_ / 2, H_ * 0.75); ctx.rotate(Math.sin(performance.now() / 500) * 0.4 + 0.8); ctx.strokeStyle = '#F3F0FF'; ctx.lineWidth = 4; ctx.strokeRect(-22, -38, 44, 76); ctx.restore(); }
}

// boot
const game = new Game();
requestAnimationFrame(now => { game.last = now; game.frame(now); });

</script>
